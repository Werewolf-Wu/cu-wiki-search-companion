# SPDX-License-Identifier: MPL-2.0
name: Nightly build

on:
  push:
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify and build userscript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build production userscript
        run: npm run build

      - name: Check patch whitespace
        run: git diff --check

      - name: Prepare verified assets
        run: |
          set -euo pipefail
          install -d nightly
          install -m 0644 \
            dist/cu-wiki-local-search.user.js \
            dist/cu-wiki-local-search.meta.js \
            dist/THIRD_PARTY_NOTICES.md \
            LICENSE \
            nightly/
          (
            cd nightly
            sha256sum \
              cu-wiki-local-search.user.js \
              cu-wiki-local-search.meta.js \
              LICENSE \
              THIRD_PARTY_NOTICES.md \
              > SHA256SUMS.txt
          )

      - name: Upload commit artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ github.sha }}
          path: nightly/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

  update-nightly:
    name: Update rolling nightly prerelease
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out complete history for release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-${{ github.sha }}
          path: nightly/

      - name: Create or update the single nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: nightly
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/nightly-release-notes.md"
          previous_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '.object.sha' 2>/dev/null || true
          )"

          {
            echo "Automated development build from commit $GITHUB_SHA."
            echo "Verify downloaded files with SHA256SUMS.txt."
            echo
            echo "## Commits since previous nightly"
            echo
            if [[ -n "$previous_sha" ]] && git cat-file -e "${previous_sha}^{commit}" 2>/dev/null; then
              echo "[Compare ${previous_sha:0:7}...${GITHUB_SHA:0:7}](https://github.com/$GITHUB_REPOSITORY/compare/$previous_sha...$GITHUB_SHA)"
              echo
              if [[ "$previous_sha" == "$GITHUB_SHA" ]]; then
                echo "- No new commits."
              else
                git log --reverse \
                  --format="- [%h](https://github.com/$GITHUB_REPOSITORY/commit/%H) %s" \
                  "$previous_sha..$GITHUB_SHA"
              fi
            else
              echo "- Initial nightly history baseline."
              git show -s \
                --format="- [%h](https://github.com/$GITHUB_REPOSITORY/commit/%H) %s" \
                "$GITHUB_SHA"
            fi
          } >"$notes_file"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" nightly/* --clobber
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" \
              -F force=true \
              >/dev/null
            gh release edit "$RELEASE_TAG" \
              --title "Nightly build" \
              --notes-file "$notes_file" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --latest=false
          else
            gh release create "$RELEASE_TAG" nightly/* \
              --title "Nightly build" \
              --notes-file "$notes_file" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --latest=false
          fi
